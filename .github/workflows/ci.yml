name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Test pure Python
        run: python -m pytest -q
        env:
          COMFORTABLE_TUI_PURE_PYTHON: '1'
      - name: Build optional extension
        run: python -m pip install --no-build-isolation -e .
        env:
          COMFORTABLE_TUI_BUILD_NATIVE: '1'
      - name: Verify native import
        run: python -c "from comfortable_tui import Renderer; assert Renderer().backend == 'cpp'"
      - name: Test native extension
        run: python -m pytest -q
      - run: python -m comfortable_tui --snapshot
      - run: python -m build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict
  overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,overlay]"
      - run: python -m pytest tests/test_overlay.py tests/test_overlay_qt.py tests/test_overlay_layer.py -q
        env:
          QT_QPA_PLATFORM: offscreen
  native-gpu-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,overlay]"
      - name: Build standalone C++ SDK and providers
        run: |
          cmake -S . -B build/gpu -A x64
          cmake --build build/gpu --config Release
          cmake --install build/gpu --config Release --prefix build/gpu-sdk
      - name: Build in-process provider example against installed SDK
        run: |
          $sdkPath = (Resolve-Path build/gpu-sdk).Path
          $pythonPath = (Get-Command python).Source
          $pybindPath = & $pythonPath -m pybind11 --cmakedir
          cmake -S examples/native -B build/inprocess -A x64 "-DCMAKE_PREFIX_PATH=$sdkPath" "-Dpybind11_DIR=$pybindPath" "-DPython_EXECUTABLE=$pythonPath"
          cmake --build build/inprocess --config Release
          python -c "import sys; sys.path.insert(0, 'build/inprocess/Release'); from _ctui_inprocess_example import InprocessProvider"
      - name: Build pybind11 GPU control plane
        run: python -m pip install --no-build-isolation -e .
        env:
          COMFORTABLE_TUI_BUILD_GPU: '1'
          COMFORTABLE_TUI_BUILD_GLASS: '1'
      - name: Check import and control plane without hardware
        run: |
          python -c "from comfortable_tui import _native_gpu, _native_glass; assert _native_gpu.protocol_version == 1; assert _native_glass.glass_protocol_version == 7; assert not hasattr(_native_gpu, 'GlassHost')"
          python examples/glass_workspace/native_controls/setup.py build_ext --build-lib build/glass-controls --build-temp build/glass-controls-temp
          python -m pytest tests/test_gpu.py tests/test_glass.py tests/test_glass_extensions.py tests/test_glass_native_extensions.py tests/test_glass_effects.py tests/test_glass_containers.py tests/test_glass_shader.py tests/test_overlay_qt.py -q
          ctest --test-dir build/gpu -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          COMFORTABLE_GLASS_EXTENSION: build/glass-controls
  portable-cpu-sdk-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable CPU frame SDK (no Linux graphical support)
        run: |
          cmake -S . -B build/cpu-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpu-sdk -j 2
          cmake --install build/cpu-sdk --prefix build/portable-sdk
