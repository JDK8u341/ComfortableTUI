name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Test pure Python
        run: python -m pytest -q
        env:
          COMFORTABLE_TUI_PURE_PYTHON: '1'
      - name: Build optional extension
        run: python -m pip install --no-build-isolation -e .
        env:
          COMFORTABLE_TUI_BUILD_NATIVE: '1'
      - name: Verify native import
        run: python -c "from comfortable_tui import Renderer; assert Renderer().backend == 'cpp'"
      - name: Test native extension
        run: python -m pytest -q
      - run: python -m comfortable_tui --snapshot
      - run: python -m build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict
  overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,overlay]"
      - run: python -m pytest tests/test_overlay.py tests/test_overlay_qt.py tests/test_overlay_layer.py -q
        env:
          QT_QPA_PLATFORM: offscreen
  native-gpu-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,overlay]"
      - name: Build standalone C++ SDK and providers
        run: |
          cmake -S . -B build/gpu -A x64
          cmake --build build/gpu --config Release
          cmake --install build/gpu --config Release --prefix build/gpu-sdk
      - name: Build in-process provider example against installed SDK
        run: |
          $sdkPath = (Resolve-Path build/gpu-sdk).Path
          $pythonPath = (Get-Command python).Source
          $pybindPath = & $pythonPath -m pybind11 --cmakedir
          cmake -S examples/native -B build/inprocess -A x64 "-DCMAKE_PREFIX_PATH=$sdkPath" "-Dpybind11_DIR=$pybindPath" "-DPython_EXECUTABLE=$pythonPath"
          cmake --build build/inprocess --config Release
          python -c "import sys; sys.path.insert(0, 'build/inprocess/Release'); from _ctui_inprocess_example import InprocessProvider"
      - name: Build pybind11 GPU control plane
        run: python -m pip install --no-build-isolation -e .
        env:
          COMFORTABLE_TUI_BUILD_GPU: '1'
      - name: Check import and control plane without hardware
        run: |
          python -c "from comfortable_tui import _native_gpu; assert _native_gpu.protocol_version == 1"
          python -m pytest tests/test_gpu.py tests/test_overlay_qt.py -q
        env:
          QT_QPA_PLATFORM: offscreen
  native-linux-host-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt development files
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-wayland libgl1-mesa-dev libopengl-dev ninja-build
      - name: Build portable frame SDK and optional native Linux window host
        run: |
          cmake -S . -B build/linux-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOMFORTABLE_TUI_BUILD_LINUX_HOST=ON
          cmake --build build/linux-host -j 2
          cmake --install build/linux-host --prefix build/linux-sdk
      # Real CEF and Wayland desktop checks remain explicit local verification;
      # building this target does not establish a compositor or GPU capability.
